[package]
name = "odd835"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
description = "Finite search engine for Erdos Problem #835 via perfect 1-code partitions of the odd graph O_k"

[[bin]]
name = "odd835"
path = "src/main.rs"

[[bin]]
name = "s45"
path = "src/s45/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Optional: POSIX signal handling for SIGINT / SIGUSR1 (spec section 8).
# Kept behind a feature so the default build uses only the four dependencies
# the spec authorises. Build with `--features signals` on Unix.
signal-hook = { version = "0.3", optional = true }

[build-dependencies]
# Only consulted under `--features cdcl`; build.rs returns early otherwise.
cc = "1"

[features]
default = []
signals = ["dep:signal-hook"]
# CDCL(T): vendored CaDiCaL 2.1.3 driven through IPASIR-UP by the exact-cover
# propagator. Requires a C++ toolchain, so it is opt-in.
cdcl = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.bench]
inherits = "release"
